name: Keep Forkcast awake

on:
  schedule:
    # Offset from the hour to avoid GitHub's busiest scheduling boundary.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: forkcast-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Render health
        shell: bash
        run: |
          body=$(curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 --retry-max-time 180 \
            'https://forkcast-fpl.onrender.com/__ping')
          if [[ "$body" != 'ok' && "$body" != 'ok '* ]]; then
            echo 'Unexpected response from the health endpoint'
            exit 1
          fi
          echo 'Forkcast is awake and responding.'
