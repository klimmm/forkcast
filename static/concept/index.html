/* ---------------------------------------------------------------- W1: connect → "your gameweek in ten seconds" */
function renderConnect() {
  const c = $('#connect');
  c.className = 'connect';
  c.innerHTML = `<div class="night"><svg viewBox="0 0 390 430" preserveAspectRatio="none" aria-hidden="true">
      <path class="fork-path" d="M195 430 C195 400 195 390 195 372"/><path class="fork-path" d="M195 374 C195 330 130 318 -10 292"/><path class="fork-path b" d="M195 374 C195 330 260 318 400 292"/>
      <circle cx="195" cy="373" r="3.5" fill="rgb(255 255 255 / .55)"/></svg></div>
    <div class="wordmark"><h1>Fork<i>cast</i></h1><p>Every gameweek is a fork. We'll show you the roads.</p></div>
    <div class="form"><label>FPL Team ID</label><div class="field"><span id="tid"></span><span class="caret"></span></div>
      <button class="where" data-act="where">Where's my ID?</button>
      <div class="recent"><span>${DATA.entry.entry_id} · ${esc(DATA.entry.team_name)}</span></div></div>
    <div class="go"><button class="primary" id="findcalls">Find my calls</button><p class="foot" style="text-align:center">Paired with your Mac${SIM()}</p></div>
    <div class="loadpitch" id="loadpitch"></div>
    <div class="narr" id="narr"></div>`;
  // type the ID in, digit by digit
  const id = String(DATA.entry.entry_id); let i = 0; const tid = $('#tid');
  const tick = () => { if (i <= id.length && document.body.contains(tid)) { tid.textContent = id.slice(0, i++); setTimeout(tick, 90); } };
  setTimeout(tick, reduceMotion ? 0 : 500);
  $('#findcalls').onclick = runW1;
  $('[data-act="where"]', c).onclick = whereSheet;
}
async function runW1() {
  const c = $('#connect'); if (c.classList.contains('loading')) return;
  c.classList.add('loading');
  const e = DATA.entry; const wc = e.chips_used.find((x) => x.chip === 'wc');
  const narr = $('#narr');
  const line = (html) => { const d = document.createElement('div'); d.className = 'ln'; d.innerHTML = `<span class="ic"></span><span>${html}</span>`; narr.appendChild(d); requestAnimationFrame(() => d.classList.add('on')); return d; };
  // 1. squad from the entry cache: shirts drop row by row
  const l1 = line('Reading your squad…');
  const host = $('#loadpitch');
  const xi0 = { gw: A, xi: e.xi, bench: e.bench, captain: e.captain, vice: e.vice, chip: null };
  mountPitch(host, xi0, { noFlip: true });
  $$('.prow', host).forEach((r, ri) => $$('.pl', r).forEach((p) => (p.style.animationDelay = `${ri * 150 + Math.random() * 60}ms`)));
  await wait(650);
  l1.classList.add('done'); l1.lastChild.innerHTML = `Your squad: ${money(e.bank)} in the bank · ${e.ft} free transfer${e.ft > 1 ? 's' : ''}${wc ? ` · Wildcard used GW${wc.gw}` : ''}`;
  await wait(350);
  const l2 = line(`Asking ${R} forecast runs<div class="rain">${Array.from({ length: R }, (_, k) => `<i style="animation-delay:${k * 28}ms"></i>`).join('')}</div>`);
  await wait(reduceMotion ? 100 : 1100); l2.classList.add('done');
  const l3 = line(`Finding your calls${SIM()}<div class="bar"><i></i></div>`);
  requestAnimationFrame(() => requestAnimationFrame(() => ($('.bar i', l3).style.width = '100%')));
  await wait(reduceMotion ? 200 : 2500); l3.classList.add('done');
  await wait(350);
  // cross-fade into This week on today's FPL picks, then the reveal: verdict words, the shirt flip, the card rising
  S.phase = 'app'; S.calls = buildCalls(); S.callIdx = 0;
  weekShell(); paintDeadline();
  mountPitch($('#wpitch'), xi0, { noFlip: true, benchPill: true });
  c.classList.add('gone');
  await wait(650);
  S.reveal = true; render();
  setTimeout(() => { S.reveal = false; $('#week').classList.remove('reveal'); }, 2200);
}
function restart() {
  Object.assign(S, { phase: 'connect', tab: 'week', moves: BASE_MOVES.slice(), caps: {}, chips: {}, calls: [], callIdx: 0, taken: {}, ticks: {}, locked: false, journal: [], aheadGw: A, aheadSeen: false, autoplay: null, caption: null, healing: null, compare: false, benchView: false });
  for (const id of ['week', 'ahead']) { const el = $(`#${id}`); el.dataset.built = ''; el.innerHTML = ''; }
  const rail = $('#rail'); rail.dataset.built = ''; rail.innerHTML = '';
  $('#toasts').innerHTML = '';
  render(); renderConnect();
}

/* ---------------------------------------------------------------- global clicks */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act], [data-road], .tab, #week .pl');
  if (!t || !$('#app').contains(t)) return;
  if (t.classList.contains('tab')) return setTab(t.dataset.tab);
  if (t.dataset.road != null) { const call = S.calls[S.callIdx]; return selectRoad(call, +t.dataset.road); }
  if (t.matches('#week .pl')) { if (t.closest('.benchview') || t.closest('#wpitch')) return openPlayer(+t.dataset.id, A); }
  const a = t.dataset.act;
  if (a === 'take') return takeRoad();
  if (a === 'why') return openWhy();
  if (a === 'ticket') return openTicket();
  if (a === 'you') return openYou();
  if (a === 'bench') { S.benchView = !S.benchView; return renderWeek(); }
  if (a === 'goahead') return setTab('ahead');
  if (a === 'wish') { stopAutoplay(); return openWish(); }
  if (a === 'fork') return openFork(S.aheadGw);
  if (a === 'chip') return openChip(t.dataset.chip);
  if (a === 'chipused') return toast(`Wildcard used GW${DATA.entry.chips_used.find((u) => u.chip === t.dataset.chip)?.gw} · back after GW${DATA.meta.chip_half ?? 19}.`);
  if (a === 'movemenu') return openMoveMenu(t.dataset.k);
  if (a === 'compare') { S.compare = !S.compare; return renderAhead(); }
  if (a === 'cmpdone') { S.compare = false; return renderAhead(); }
  if (a === 'adopt') { const snap = snapshot(); S.compare = false; S.moves = BASE_MOVES.slice(); S.caps = {}; S.chips = {}; render(); return toast('Back on the model\'s plan.', { undo: () => restore(snap) }); }
  if (a === 'where') return whereSheet();
});

/* ---------------------------------------------------------------- desktop: tour + legend + scale-to-fit */

  return `<div class="legend-row"><span class="k real">Real</span><ul>
      <li>Your squad, sell prices, bank ${money(DATA.entry.bank)}, ${DATA.entry.ft} FT, chips, rank and points (<code>/api/entry/${DATA.entry.entry_id}</code>, FPL cache).</li>
      <li>Deadline, GW${A} (<code>/api/meta</code>).</li>
      <li>Forecast xP GW${A}–${EDGE}, min/max, fixtures, status, FPL price projection (<code>/api/players</code>), and the ${R} per-run forecasts from the same pool files.</li>
      <li>The model's plan GW${A}–${LAST}: every move, XI, captain, bench, bank, FT, objective terms and the noise floor ${NOISE.toFixed(3)} — one real solve (${DATA.meta.solve_elapsed.toFixed(1)} s, w4, exact).</li></ul></div>
    <div class="legend-row"><span class="k phone">Phone ≈</span><ul>
      <li>Run votes, verdicts (Clear / Lean / Coin flip), payback and captain votes: computed live in the page from the real runs.</li>
      <li>Roll and next-best roads, veto Plan B, sell-from-week, Wish pills, Why-not, forks and chip estimates: the design's phone engine (best XI per week by forecast) on real data. The app would confirm each with a solve.</li></ul></div>
    <div class="legend-row"><span class="k sim">SIM</span><ul>
      <li>Solver latency and "the Mac confirmed" toasts after edits (fake 2–4 s; the numbers are the phone's).</li>
      <li>First-run progress timings, pairing, Mac status, FPL links, ticket persistence, after-deadline checks.</li></ul></div>`;
}
const TOUR = [
  ['W1 · Your gameweek in ten seconds', 'From first run: the ID types itself, tap "Find my calls". Shirts drop in, the verdict lands, Tavernier flips into Groß.', 'Restart', () => { closeAll(); restart(); setTimeout(runW1, 1300); }],
  ['Switch roads', 'On the call card tap Roll (or swipe the card sideways). The pitch morphs back and the big number rolls negative.', 'Show me', async () => { await ensureApp(); setTab('week'); S.callIdx = 0; S.taken = {}; S.moves = BASE_MOVES.slice(); S.caps = {}; $('#deck').dataset.k = ''; render(); await wait(500); selectRoad(S.calls[0], 1); await wait(1600); selectRoad(S.calls[0], 0); }],
  ['Why: every forecast run', 'Tap "Why ›": a dot per forecast run against the "too close" band, then "Show runs" for the lines.', 'Open Why', async () => { await ensureApp(); setTab('week'); closeAll(); openWhy(); }],
  ['Armband: a coin flip, honestly', 'Take the transfer; the armband card says Haaland leads in 18 of 25 runs and calls it a coin flip. Tap Saka: the C badge hops.', 'Show me', async () => { await ensureApp(); setTab('week'); closeAll(); if (S.callIdx === 0) await takeRoad(); await wait(900); const c = S.calls[S.callIdx]; if (c?.type === 'armband') { selectRoad(c, 1); await wait(1500); selectRoad(c, 0); } }],
  ['Lock in → Ticket', 'Take the roads, then "Lock in GW6". Tick the rows like a Wallet pass until it stamps LOCKED.', 'Open ticket', async () => { await ensureApp(); setTab('week'); closeAll(); openTicket(); }],
  ['W2 · Scrub the next four weeks', 'Open Ahead: the plan plays GW6→9 once by itself (any touch stops it). Then drag the glass rail or swipe the pitch.', 'Play it', async () => { await ensureApp(); closeAll(); S.aheadSeen = false; setTab('week'); await wait(100); setTab('ahead'); }],
  ['W2 · Sell from a later week', 'On Ahead, long-press a shirt (try Szoboszlai) and drop it on the GW7 tick. Pick a replacement: only GW7–9 shimmer ≈, then one line says whether your disagreement matters.', 'Show me', async () => { await ensureApp(); resetPlan(); setTab('ahead'); setGw(A + 1); await wait(400); const sz = byName('Szoboszlai'); openReplace(sz && cur().weeks[1].squad.includes(sz) ? sz : cur().weeks[1].xi[5], A + 1); }],
  ['W3 · Wish for a player', '"+ Wish", tap Reach on someone: four arrival pills fill two at a time with the funding move. "Make it the plan" reroutes the rail.', 'Open Wish', async () => { await ensureApp(); resetPlan(); setTab('ahead'); openWish(byName('E.Le Fée') ?? null); }],
  ['W3 · Veto a move', 'Swipe a move row left (or ⋯ → Not him). The best plan without him flips in with its honest price. GW9 is a good one: the answer is a coin flip.', 'Show me', async () => { await ensureApp(); resetPlan(); setTab('ahead'); setGw(LAST); await wait(500); const row = $('#apanel .mrow'); if (!row) return; const fg = $('.fg', row); fg.style.transform = 'translateX(-120px)'; await wait(450); row.classList.add('out'); await wait(280); veto(row.dataset.k); }],
  ['Forks instead of settings', 'Long-press a rail tick (or ⋯ Fork): "Roll this week?" / "Allow a −4 here?" as lanes A and B.', 'Open fork', async () => { await ensureApp(); resetPlan(); setTab('ahead'); openFork(A + 2); }],
];
function resetPlan() { closeAll(); clearTimeout(S.healT); Object.assign(S, { moves: BASE_MOVES.slice(), caps: {}, chips: {}, healing: null, compare: false, aheadSeen: true }); stopAutoplay(); render(); }
async function ensureApp() { if (S.phase !== 'app') { closeAll(); const c = $('#connect'); if (!c.classList.contains('loading')) await runW1(); else while (S.phase !== 'app') await wait(200); await wait(400); } }
function renderPanel() {
  $('#pTeam').textContent = `${DATA.entry.entry_id} · ${DATA.entry.team_name}`;
  $('#tour').innerHTML = TOUR.map(([t, d, b], i) => `<div class="step"><span class="n">${i + 1}</span><b>${t}</b><p>${d}</p><button data-tour="${i}">${b}</button></div>`).join('');
  $$('[data-tour]').forEach((b) => (b.onclick = () => TOUR[+b.dataset.tour][3]()));
  $('#legend').innerHTML = legendHTML();
  $('#simToggle').onchange = (e) => document.body.classList.toggle('show-sim', e.target.checked);
}
function fit() {
  const dev = $('#device'); const slot = $('#slot');
  if (innerWidth <= 520) { S.scale = 1; dev.style.transform = ''; slot.style.width = ''; slot.style.height = ''; return; }
  const s = Math.min(1, (innerHeight - 32) / 868, (innerWidth - 48) / 414);
  S.scale = s; dev.style.transform = `scale(${s})`; slot.style.width = `${414 * s}px`; slot.style.height = `${868 * s}px`;
}
addEventListener('resize', () => { fit(); if (S.phase === 'app') placeLens(); });
setInterval(() => { if (S.phase === 'app') paintDeadline(); }, 30000);

/* ---------------------------------------------------------------- boot */
fit(); renderPanel(); renderConnect(); wireRail(); render();
if (getComputedStyle($('#panel')).display === 'none') setTimeout(() => { if (S.phase === 'connect') toast('Concept: pink SIM tags mark simulated bits. Notes in the avatar sheet.', { ms: 3800 }); }, 700);
</script>
