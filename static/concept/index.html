<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120A1E">
<title>Forkcast Concept</title>
<style>
/* ============================================================ tokens */
:root {
  --bg: #120A1E; --surface: #1D1230; --surface-2: #26183C; --surface-3: #2F2049;
  --glass: rgb(29 18 48 / .72); --hair: rgb(255 255 255 / .10);
  --text: #F4F0FA; --text-2: #C9C0D8; --muted: #8F84A3;
  --accent: #8A7AFF; --accent-ink: #120A1E; --accent-soft: rgb(138 122 255 / .16);
  --clear: #4CC98A; --lean: #F2B84B; --coin: #8F84A3; --loss: #F07B7B;
  --turf-a: #1d5f42; --turf-b: #1a573c; --chalk: rgb(255 255 255 / .26); --plate: rgb(9 14 30 / .86);
  --sim: #FF7AD9;
  --f-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --f-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --safe-top: 59px; --safe-bot: 34px; --tab-h: 49px;
  --spring: cubic-bezier(.32, .72, 0, 1);
  --bounce: cubic-bezier(.34, 1.45, .55, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: #07040d radial-gradient(1200px 700px at 50% -10%, #241540 0%, #0b0614 55%, #07040d 100%) fixed;
  color: var(--text); font: 15px/1.35 var(--f-text); -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-family: var(--f-round); font-variant-numeric: tabular-nums; }

/* ============================================================ stage + device */
.stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 44px; padding: 16px 24px; }
.device-slot { flex: none; position: relative; }
.device {
  width: 414px; height: 868px; padding: 12px; border-radius: 68px; position: relative;
  background: linear-gradient(145deg, #3a3542, #16141b 40%, #2a2630);
  box-shadow: 0 0 0 1.5px #4a4553, 0 0 0 6px #0d0c10, 0 50px 120px -20px rgb(0 0 0 / .8), 0 0 80px rgb(138 122 255 / .08);
  transform-origin: top left;
}
.device::before, .device::after { content: ""; position: absolute; width: 4px; border-radius: 2px; background: #2c2833; }
.device::before { left: -5px; top: 180px; height: 64px; box-shadow: 0 84px 0 #2c2833; }
.device::after { right: -5px; top: 230px; height: 100px; }
.app {
  width: 390px; height: 844px; border-radius: 56px; overflow: hidden; position: relative; isolation: isolate;
  background: radial-gradient(130% 55% at 50% -12%, #2b1a4a 0%, #170d27 45%, var(--bg) 75%);
  user-select: none; -webkit-user-select: none;
}
.island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; z-index: 200; }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 190; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 46px; pointer-events: none; }
.statusbar .t { font: 600 16px var(--f-text); letter-spacing: -.01em; }
.statusbar .ic { display: flex; gap: 6px; align-items: center; }
.homeind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: rgb(255 255 255 / .82); z-index: 300; pointer-events: none; }

/* side panel (desktop only) */
.panel { flex: 0 1 340px; max-width: 340px; height: calc(100vh - 32px); overflow-y: auto; scrollbar-width: thin; padding: 18px 4px 40px 0; color: var(--text-2); }
.panel h1 { font: 600 26px/1.15 var(--f-serif); color: var(--text); margin: 0 0 6px; letter-spacing: -.01em; }
.panel .lede { font-size: 14px; color: var(--muted); margin: 0 0 18px; }
.panel h2 { font: 600 11px var(--f-text); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 4px 10px; padding: 12px; border-radius: 14px; background: rgb(255 255 255 / .03); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .07); margin-bottom: 8px; }
.step .n { grid-row: span 3; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--f-round); background: var(--accent-soft); color: var(--accent); }
.step b { color: var(--text); font-weight: 600; font-size: 14px; }
.step p { margin: 0; font-size: 12.5px; color: var(--muted); }
.step button { justify-self: start; margin-top: 4px; border: 0; border-radius: 999px; padding: 5px 12px; font: 600 12px var(--f-text); background: var(--accent); color: var(--accent-ink); }
.legend-row { display: grid; grid-template-columns: 70px 1fr; gap: 10px; font-size: 12.5px; padding: 8px 0; border-top: .5px solid rgb(255 255 255 / .08); }
.legend-row .k { font: 700 10.5px var(--f-text); letter-spacing: .08em; text-transform: uppercase; padding-top: 2px; }
.k.real { color: var(--clear); } .k.phone { color: var(--accent); } .k.sim { color: var(--sim); }
.legend-row ul { margin: 0; padding-left: 16px; } .legend-row li { margin: 2px 0; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); margin-top: 10px; cursor: pointer; }
.toggle input { accent-color: var(--sim); width: 16px; height: 16px; }

code { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-2); }
/* W1 reveal: verdict words first, then the shirt flips, then the call card rises */
.reveal .flipper { transition-delay: .55s; }
.reveal .pl.in .kit::before { animation-delay: .75s; animation-fill-mode: both; }
.reveal .card { animation-delay: 1s; animation-fill-mode: both; }
.reveal .also { animation: capIn .4s 1.2s var(--spring) both; }

/* ============================================================ SIM markers */
.sim-tag { display: none; }
body.show-sim .sim-tag {
  display: inline-flex; align-items: center; height: 14px; padding: 0 5px; margin-left: 6px; border-radius: 4px; vertical-align: middle;
  font: 700 8.5px/14px var(--f-text); letter-spacing: .08em; color: var(--sim); box-shadow: inset 0 0 0 1px rgb(255 122 217 / .7); background: rgb(255 122 217 / .08);
}
body.show-sim .sim-box { outline: 1px dashed rgb(255 122 217 / .55); outline-offset: 2px; }

/* ============================================================ screens */
.screen {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  padding-top: var(--safe-top); padding-bottom: calc(var(--tab-h) + var(--safe-bot) + 16px);
  transition: opacity .28s ease, transform .5s var(--spring), border-radius .5s var(--spring), filter .4s;
}
.screen::-webkit-scrollbar { display: none; }
.screen.off { opacity: 0; pointer-events: none; transform: translateX(14px); }
.app.sheet-large .screen, .app.sheet-large .tabbar, .app.sheet-large .rail { transform: scale(.935) translateY(8px); border-radius: 22px; filter: brightness(.7); }
#ahead { padding-bottom: calc(var(--tab-h) + var(--safe-bot) + 92px); }

.hdr { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.hdr .gw { font: 600 17px var(--f-text); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.hdr .dl { font: 13px var(--f-text); color: var(--text-2); }
.dl.soon { color: var(--lean); } .dl.urgent { color: var(--loss); }
.avatar { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 0; display: grid; place-items: center; font: 700 12.5px var(--f-round); letter-spacing: .02em;
  background: linear-gradient(140deg, #ff8f6b, #8a7aff 70%); color: #fff; box-shadow: 0 0 0 .5px rgb(255 255 255 / .3), 0 6px 16px -6px rgb(138 122 255 / .7); }
.avatar .dot { position: absolute; right: -1px; bottom: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--clear); box-shadow: 0 0 0 2px var(--bg); }
.avatar .dot.amber { background: var(--lean); }

/* verdict */
.verdict { padding: 2px 16px 10px; min-height: 72px; }
.sentence { font: 600 22px/1.18 var(--f-serif); letter-spacing: -.012em; margin: 0; color: var(--text); }
.sentence .w { display: inline-block; opacity: 0; transform: translateY(6px); filter: blur(3px); animation: wordIn .5s var(--spring) forwards; }
@keyframes wordIn { to { opacity: 1; transform: none; filter: none; } }
.vsub { position: relative; overflow: hidden; margin: 6px 0 0; font: 13px var(--f-text); color: var(--text-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.frag { display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 8px; border-radius: 999px; font: 600 12px var(--f-text); color: var(--clear); background: rgb(76 201 138 / .12); animation: fragIn .45s var(--bounce); }
@keyframes fragIn { from { transform: scale(.6); opacity: 0; } }
.g-clear { color: var(--clear); } .g-lean { color: var(--lean); } .g-coin { color: var(--coin); } .g-loss { color: var(--loss); }

/* ============================================================ pitch */
.pitch-wrap { position: relative; margin: 0 16px; }
.pitch {
  --kit: 36px; position: relative; height: 280px; border-radius: 20px; overflow: hidden;
  background: repeating-linear-gradient(180deg, var(--turf-a) 0 12.5%, var(--turf-b) 12.5% 25%);
  box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .1), 0 18px 40px -22px rgb(0 0 0 / .9);
}
.pitch::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(55% 45% at 8% -6%, rgb(255 255 240 / .16), transparent 70%), radial-gradient(55% 45% at 92% -6%, rgb(255 255 240 / .16), transparent 70%), radial-gradient(120% 90% at 50% 50%, transparent 55%, rgb(0 0 0 / .35)); }
.pitch .lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pitch .lines * { fill: none; stroke: var(--chalk); stroke-width: 1.4; }
.pitch .lines .spot { fill: var(--chalk); stroke: none; }
.rows { position: absolute; inset: 6px 2px 5px; display: flex; flex-direction: column; justify-content: space-between; z-index: 1; transition: opacity .3s; }
.prow { display: flex; justify-content: space-evenly; align-items: flex-start; }
.pl { position: relative; width: 68px; display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0; transition: opacity .35s, transform .25s var(--bounce), filter .3s; touch-action: manipulation; }
.pl:active { transform: scale(.96); }
.pl.dim { opacity: .6; filter: saturate(.75); }
.pl.ghostdiff .kit { outline: 1.5px dashed rgb(255 255 255 / .7); outline-offset: 3px; border-radius: 10px; }
.pl.lifted { opacity: .25; }
.kit { position: relative; width: var(--kit); height: var(--kit); perspective: 260px; }
.flipper { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 320ms cubic-bezier(.3, .7, .3, 1.15); }
.flipper.from { transform: rotateY(-180deg); transition: none; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; filter: drop-shadow(0 3px 3px rgb(0 0 0 / .35)); }
.face.back { transform: rotateY(180deg); }
.face svg { display: block; width: 100%; height: 100%; }
.pl.in .kit::before { content: ""; position: absolute; left: 50%; top: 52%; width: 150%; height: 150%; transform: translate(-50%, -50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgb(76 201 138 / .45), transparent); box-shadow: 0 0 0 1.5px rgb(76 201 138 / .9); animation: ringIn .6s var(--bounce); }
@keyframes ringIn { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } }
.pl.out-ghost .kit { opacity: .35; }
.badge { position: absolute; top: -4px; right: -7px; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font: 800 10px/1 var(--f-round); z-index: 3; }
.badge.c { background: #0b0b10; color: #fff; box-shadow: 0 0 0 1.5px #fff, 0 2px 6px rgb(0 0 0 / .5); }
.badge.v { background: #fff; color: #0b0b10; box-shadow: 0 2px 6px rgb(0 0 0 / .4); }
.badge.tc { width: 21px; border-radius: 9px; }
.corner { position: absolute; top: -2px; left: -5px; width: 10px; height: 10px; border-radius: 50%; z-index: 3; box-shadow: 0 0 0 2px rgb(9 14 30 / .7); }
.corner.amber { background: var(--lean); } .corner.red { background: var(--loss); }
.tag { position: absolute; top: -6px; left: -12px; z-index: 3; padding: 1px 4px; border-radius: 5px; font: 700 9px/12px var(--f-round); background: rgb(9 14 30 / .9); color: var(--lean); box-shadow: 0 0 0 .5px rgb(242 184 75 / .5); }
.plate { margin-top: 2px; max-width: 68px; min-width: 50px; padding: 1px 6px 2px; border-radius: 7px; background: var(--plate); text-align: center; line-height: 1.02; box-shadow: 0 0 0 .5px rgb(255 255 255 / .06); }
.plate .pn { display: block; font: 600 11px/1.04 var(--f-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.plate .px { display: block; font: 600 12px/1.04 var(--f-round); font-variant-numeric: tabular-nums; color: var(--text-2); }
.pl.in .plate { background: linear-gradient(rgb(76 201 138 / .28), rgb(76 201 138 / .28)), var(--plate); }
.pl.in .plate .px { color: #c9f5dc; }
.plate.chg { animation: plateIn .35s ease; }
@keyframes plateIn { from { opacity: 0; transform: translateY(-3px); } }
.approx .px::before, .px.approx::before { content: "≈"; margin-right: 1px; color: var(--muted); }
.bench-pill { position: absolute; right: 8px; top: 8px; z-index: 4; height: 28px; padding: 0 10px; border-radius: 999px; border: 0; font: 600 12px var(--f-text); color: var(--text); background: rgb(9 14 30 / .7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 0 0 .5px rgb(255 255 255 / .16); }
.benchview { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 18px; background: rgb(9 14 30 / .55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity .3s; }
.benchview.on { opacity: 1; pointer-events: auto; }
.benchview h4 { margin: 0; text-align: center; font: 600 12px var(--f-text); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.benchview .prow { justify-content: space-around; }
.border { display: block; font: 700 10px var(--f-round); color: var(--muted); margin-bottom: 4px; text-align: center; }
.capfly { position: absolute; z-index: 50; pointer-events: none; }

/* ============================================================ call card */
.deck { position: relative; padding: 0 16px; margin-top: 10px; min-height: 270px; }
.card {
  position: relative; padding: 12px 16px 14px; border-radius: 22px;
  background: linear-gradient(180deg, #281a40, #1d1230 60%);
  box-shadow: 0 0 0 .5px rgb(255 255 255 / .09), inset 0 .5px 0 rgb(255 255 255 / .08), 0 24px 44px -24px rgb(0 0 0 / .9);
  animation: cardIn .55s var(--spring);
}
@keyframes cardIn { from { transform: translateY(40px); opacity: 0; } }
.card.leaving { animation: cardOut .42s var(--spring) forwards; }
@keyframes cardOut { to { transform: translateY(-30px) scale(.94); opacity: 0; } }
.eyebrow { display: flex; justify-content: space-between; align-items: center; font: 600 12px var(--f-text); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 4px 0 4px 10px; color: var(--accent); font: 600 14px var(--f-text); letter-spacing: 0; text-transform: none; }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 36px; padding: 2px; margin-top: 10px; border-radius: 12px; background: rgb(0 0 0 / .28); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .06); }
.seg button { position: relative; z-index: 1; border: 0; background: none; color: var(--text-2); font: 600 13.5px var(--f-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; transition: color .2s; }
.seg button[aria-selected="true"] { color: var(--text); }
.seg button .md { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: middle; transform: translateY(-1px); }
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 10px; background: linear-gradient(#433064, #392a55); box-shadow: 0 2px 6px rgb(0 0 0 / .4), inset 0 .5px 0 rgb(255 255 255 / .14); transition: transform .38s var(--bounce); }
.big { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.big .unit { line-height: 1.25; }
.vrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.big .unit { font: 15px var(--f-text); color: var(--text-2); }
.odo { display: inline-flex; font: 600 36px/1 var(--f-round); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.odo .d { display: inline-block; height: 1.04em; overflow: hidden; }
.odo .col { display: flex; flex-direction: column; transition: transform .42s cubic-bezier(.2, .9, .25, 1.05); }
.odo .col span { height: 1.04em; line-height: 1.04em; }
.odo .s { display: inline-block; line-height: 1.04em; }
.odo.pos { color: var(--text); } .odo.neg { color: var(--loss); }
.vline { font: 600 15px var(--f-text); min-width: 0; }
.vline .note { font-weight: 400; color: var(--text-2); }
.pbk { display: flex; flex-direction: column; align-items: flex-end; gap: 0; font: 600 12px var(--f-text); color: var(--text-2); flex: none; text-align: right; }
.pbk svg { flex: none; }
.ctx { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 5px 10px; border-radius: 999px; font: 600 12px var(--f-text); }
.ctx.price { color: var(--lean); background: rgb(242 184 75 / .1); }
.ctx.ft { color: var(--text-2); background: rgb(255 255 255 / .06); }
.ctx.avail { color: var(--loss); background: rgb(240 123 123 / .1); }
.primary {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; margin-top: 12px;
  border: 0; border-radius: 15px; color: #140b24; font: 600 17px var(--f-text); letter-spacing: -.01em;
  background: linear-gradient(180deg, #a497ff, #7e6cf7); box-shadow: 0 12px 26px -10px rgb(138 122 255 / .75), inset 0 .5px 0 rgb(255 255 255 / .5);
  transition: transform .2s var(--bounce), filter .2s;
}
.primary:active { transform: scale(.97); }
.primary.done { background: linear-gradient(180deg, #5fdb9c, #3fb879); box-shadow: 0 12px 26px -10px rgb(76 201 138 / .7); }
.primary .chk path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .25s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.secondary { display: flex; align-items: center; justify-content: center; width: 100%; height: 46px; margin-top: 10px; border: 0; border-radius: 14px; background: rgb(255 255 255 / .07); color: var(--text); font: 600 15px var(--f-text); }
.also { margin: 12px 16px 0; padding: 0 2px; font: 13px var(--f-text); color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.also button { border: 0; background: none; color: var(--text-2); padding: 6px 0; font: inherit; }
.bump { animation: bump .32s var(--bounce); }
@keyframes bump { 50% { transform: scale(1.04); } }

/* ============================================================ tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 60; height: calc(var(--tab-h) + var(--safe-bot)); padding-bottom: var(--safe-bot);
  display: grid; grid-template-columns: 1fr 1fr; background: rgb(18 10 30 / .72); backdrop-filter: blur(22px) saturate(170%); -webkit-backdrop-filter: blur(22px) saturate(170%);
  box-shadow: inset 0 .5px 0 rgb(255 255 255 / .1); transition: transform .5s var(--spring), filter .4s; }
.tab { position: relative; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font: 600 10.5px var(--f-text); }
.tab[aria-current="page"] { color: var(--accent); }
.tab .bd { position: absolute; top: 6px; left: calc(50% + 10px); width: 8px; height: 8px; border-radius: 50%; background: var(--lean); box-shadow: 0 0 0 2px var(--bg); }

/* ============================================================ ahead */
.ahead-total { text-align: right; }
.ahead-total .t { font: 600 17px var(--f-round); font-variant-numeric: tabular-nums; }
.ahead-total .t small { font: 13px var(--f-text); color: var(--muted); margin-right: 4px; }
.ghostpill { margin-top: 2px; border: 0; border-radius: 999px; padding: 2px 8px; font: 600 11.5px var(--f-text); background: rgb(76 201 138 / .1); color: var(--clear); }
.ghostpill.diff { background: var(--accent-soft); color: var(--accent); }
.hdr.tall { height: 56px; }
.hdr h1 { margin: 0; font: 700 28px var(--f-text); letter-spacing: -.02em; }
.wstrip { display: flex; justify-content: space-between; align-items: center; height: 40px; padding: 0 16px; font: 13px var(--f-text); color: var(--text-2); }
.wstrip b { font: 600 15px var(--f-text); color: var(--text); }
.pencil { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px; font: 600 10.5px/18px var(--f-text); letter-spacing: .04em; color: var(--text-2); outline: 1.5px dashed rgb(201 192 216 / .45); outline-offset: -1.5px; }
.ink { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px; font: 600 10.5px/18px var(--f-text); color: var(--clear); background: rgb(76 201 138 / .12); }
#ahead .pitch { --kit: 40px; height: 290px; }
#ahead .pitch .pl { touch-action: none; }
.caption { position: absolute; left: 12px; right: 12px; bottom: calc(var(--tab-h) + var(--safe-bot) + 84px); z-index: 56; text-align: center; pointer-events: none; }
.caption span { display: inline-block; padding: 5px 11px; border-radius: 999px; font: 600 12.5px var(--f-text); background: rgb(9 14 30 / .78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 0 0 .5px rgb(255 255 255 / .12); animation: capIn .4s var(--spring); }
@keyframes capIn { from { opacity: 0; transform: translateY(-6px); } }
.benchrow { display: flex; align-items: center; gap: 6px; margin: 10px 16px 0; padding: 6px 10px; border-radius: 14px; background: rgb(255 255 255 / .04); }
.benchrow .lbl { font: 600 11px var(--f-text); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 44px; }
.benchrow .bs { flex: 1; display: flex; align-items: center; gap: 5px; min-width: 0; }
.benchrow .bs .mk { width: 26px; height: 26px; flex: none; }
.benchrow .bs .tx { min-width: 0; line-height: 1.1; }
.benchrow .bs .tx b { display: block; font: 600 11px var(--f-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.benchrow .bs .tx span { display: block; font: 11px var(--f-round); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panelw { margin: 12px 16px 0; padding: 12px 14px; border-radius: 20px; background: var(--surface); box-shadow: 0 0 0 .5px rgb(255 255 255 / .07); }
.panelw .ph { display: flex; align-items: center; justify-content: space-between; }
.panelw .ph b { font: 600 15px var(--f-text); }
.chipbtn { border: 0; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 600 13px var(--f-text); margin-left: 6px; }
.chipbtn.ghost { background: rgb(255 255 255 / .06); color: var(--text-2); }
.moves { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.mrow { position: relative; border-radius: 12px; overflow: hidden; background: rgb(240 123 123 / .9); }
.mrow .veto-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 16px; font: 600 13px var(--f-text); color: #2a0b10; }
.mrow .fg { position: relative; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 8px; background: var(--surface-2); touch-action: pan-y; transition: transform .35s var(--spring); }
.mrow .fg.dragging { transition: none; }
.mrow .hd { color: var(--muted); font-size: 14px; width: 14px; text-align: center; }
.mrow .mk { width: 24px; height: 24px; flex: none; }
.mrow .mt { flex: 1; min-width: 0; font: 600 14px var(--f-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .mt .ar { color: var(--muted); font-weight: 400; margin: 0 4px; }
.mrow .md { font: 600 13px var(--f-round); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mrow .more { border: 0; background: none; color: var(--muted); width: 28px; height: 32px; font-size: 18px; line-height: 1; }
.mrow.out { animation: rowOut .35s var(--spring) forwards; }
@keyframes rowOut { to { transform: translateX(-110%); opacity: 0; } }
.empty { padding: 10px 2px 4px; font: 14px var(--f-text); color: var(--text-2); }
.chips { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 0; height: 40px; padding: 4px 10px; border-radius: 12px; border: 0; background: rgb(255 255 255 / .05); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .1); text-align: left; }
.chip b { font: 700 12px var(--f-round); letter-spacing: .04em; }
.chip span { font: 600 11px var(--f-round); color: var(--text-2); }
.chip.used { opacity: .45; }
.chip.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgb(138 122 255 / .6); }
.chip.on b { color: var(--accent); }
.chip.pulse { animation: bump .4s var(--bounce); }

/* rail */
.rail { position: absolute; left: 10px; right: 10px; bottom: calc(var(--tab-h) + var(--safe-bot) + 8px); z-index: 55; height: 66px; border-radius: 22px;
  background: var(--glass); backdrop-filter: blur(22px) saturate(170%); -webkit-backdrop-filter: blur(22px) saturate(170%);
  box-shadow: 0 0 0 .5px var(--hair), 0 16px 34px -12px rgb(0 0 0 / .8); display: grid; grid-template-columns: repeat(4, 1fr) .78fr; touch-action: none; padding: 0 4px;
  transition: transform .5s var(--spring), filter .4s, opacity .3s; }
.rail.hidden { opacity: 0; pointer-events: none; transform: translateY(16px); }
.lens { position: absolute; top: 6px; bottom: 6px; left: 4px; border-radius: 16px; background: rgb(138 122 255 / .16); box-shadow: inset 0 0 0 1px rgb(138 122 255 / .5), 0 0 22px rgb(138 122 255 / .18); transition: transform .42s var(--bounce); pointer-events: none; }
.rail.dragging .lens { transition: transform .08s linear; }
.tick { position: relative; z-index: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; overflow: hidden; border-radius: 16px; }
.tick .g { font: 600 11.5px var(--f-round); color: var(--muted); letter-spacing: .02em; transition: color .2s, transform .3s var(--bounce); }
.tick .p { font: 600 16px var(--f-round); font-variant-numeric: tabular-nums; }
.tick .dots { display: flex; gap: 3px; height: 5px; align-items: center; }
.tick .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.tick .dots i.h { background: var(--loss); }
.tick .dots em { font: 700 8px var(--f-round); font-style: normal; color: var(--accent); }
.tick.sel .g { color: var(--accent); transform: scale(1.12); }
.tick.edge { opacity: .5; border-left: 1px dashed rgb(201 192 216 / .35); border-radius: 0; }
.tick.edge .p { font: 600 10px var(--f-text); color: var(--muted); }
.tick.glow { box-shadow: inset 0 0 0 1.5px rgb(76 201 138 / .7); background: rgb(76 201 138 / .08); }
.tick.hover { background: rgb(76 201 138 / .2); }
.tick.bad { opacity: .35; }
.tick.heal::after, .shimmer::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgb(255 255 255 / .16) 50%, transparent 80%); background-size: 220% 100%; animation: sweep .9s linear infinite; pointer-events: none; }
@keyframes sweep { from { background-position: 130% 0; } to { background-position: -90% 0; } }
.tick.heal .p::before { content: "≈"; color: var(--muted); margin-right: 1px; }
.tick.reroute .g { animation: reroute .5s var(--bounce); }
@keyframes reroute { 40% { transform: scale(1.35); color: var(--clear); } }
.dashed { outline: 1.5px dashed rgb(201 192 216 / .55); outline-offset: 2px; border-radius: 6px; }
.comparebar { margin: 10px 16px 0; padding: 10px 12px; border-radius: 16px; background: var(--accent-soft); display: flex; align-items: center; gap: 8px; font: 13px var(--f-text); animation: capIn .3s var(--spring); }
.comparebar .t { flex: 1; }
.comparebar button { border: 0; border-radius: 999px; height: 30px; padding: 0 12px; font: 600 13px var(--f-text); background: var(--accent); color: var(--accent-ink); }
.comparebar button.ghost { background: rgb(255 255 255 / .08); color: var(--text); }

/* drag ghost */
.dragghost { position: absolute; z-index: 400; width: 56px; height: 56px; margin: -28px 0 0 -28px; pointer-events: none; transform: scale(1.12); filter: drop-shadow(0 14px 18px rgb(0 0 0 / .6)); transition: transform .15s; }
.draghint { position: absolute; left: 0; right: 0; z-index: 401; text-align: center; pointer-events: none; }
.draghint span { display: inline-block; padding: 6px 12px; border-radius: 999px; background: rgb(9 14 30 / .9); font: 600 12.5px var(--f-text); box-shadow: 0 0 0 .5px rgb(255 255 255 / .15); }

/* ============================================================ connect / W1 */
.connect { position: absolute; inset: 0; z-index: 150; overflow: hidden; transition: opacity .6s ease, transform .6s var(--spring);
  background: radial-gradient(120% 70% at 50% 0%, #2c1b4d 0%, #150c24 50%, #0d0717 100%); }
.connect.gone { opacity: 0; pointer-events: none; transform: scale(1.04); }
.connect .night { position: absolute; left: 0; right: 0; top: 0; height: 430px; overflow: hidden; transition: opacity .4s; }
.connect .night svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.fork-path { fill: none; stroke: rgb(255 255 255 / .22); stroke-width: 1.6; stroke-dasharray: 600; stroke-dashoffset: 600; animation: forkdraw 2.2s .2s var(--spring) forwards; }
.fork-path.b { stroke: rgb(138 122 255 / .7); animation-delay: .8s; }
@keyframes forkdraw { to { stroke-dashoffset: 0; } }
.wordmark { position: absolute; left: 24px; right: 24px; top: 150px; }
.wordmark h1 { margin: 0; font: 600 44px/1 var(--f-serif); letter-spacing: -.02em; }
.wordmark h1 i { font-style: normal; color: var(--accent); }
.wordmark p { margin: 12px 0 0; font: 17px/1.35 var(--f-text); color: var(--text-2); max-width: 300px; }
.form { position: absolute; left: 20px; right: 20px; top: 430px; transition: opacity .35s, transform .45s var(--spring); }
.form label { display: block; font: 600 12px var(--f-text); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.field { display: flex; align-items: center; height: 58px; padding: 0 16px; border-radius: 16px; background: rgb(255 255 255 / .06); box-shadow: inset 0 0 0 1px rgb(138 122 255 / .55), 0 0 0 4px rgb(138 122 255 / .12); font: 600 24px var(--f-round); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.field .caret { width: 2px; height: 26px; margin-left: 2px; background: var(--accent); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.form .where { display: inline-block; margin-top: 10px; border: 0; background: none; color: var(--accent); font: 14px var(--f-text); padding: 4px 0; }
.recent { display: flex; gap: 8px; margin-top: 10px; }
.recent span { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgb(255 255 255 / .07); font: 600 13px var(--f-text); color: var(--text-2); }
.connect .go { position: absolute; left: 20px; right: 20px; bottom: calc(var(--safe-bot) + 20px); transition: opacity .3s; }
.loadpitch { position: absolute; left: 16px; right: 16px; top: calc(var(--safe-top) + 60px); opacity: 0; transform: translateY(20px); transition: opacity .5s, transform .6s var(--spring); }
.connect.loading .loadpitch { opacity: 1; transform: none; }
.connect.loading .form, .connect.loading .go, .connect.loading .wordmark p, .connect.loading .night { opacity: 0; pointer-events: none; }
.connect.loading .wordmark { top: calc(var(--safe-top) + 8px); transition: top .6s var(--spring); }
.connect.loading .wordmark h1 { font-size: 30px; transition: font-size .6s var(--spring); }
.wordmark { transition: top .6s var(--spring); } .wordmark h1 { transition: font-size .6s var(--spring); }
.loadpitch .pl { animation: dropIn .55s var(--bounce) both; }
@keyframes dropIn { from { transform: translateY(-36px) scale(.7); opacity: 0; } }
.narr { position: absolute; left: 22px; right: 22px; top: calc(var(--safe-top) + 372px); display: flex; flex-direction: column; gap: 14px; }
.narr .ln { display: flex; gap: 12px; align-items: flex-start; font: 15px/1.35 var(--f-text); color: var(--text-2); opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .45s var(--spring); }
.narr .ln.on { opacity: 1; transform: none; }
.narr .ln.done { color: var(--text); }
.narr .ic { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px rgb(138 122 255 / .5); }
.narr .ln:not(.done) .ic { border: 2px solid rgb(138 122 255 / .25); border-top-color: var(--accent); box-shadow: none; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.narr .ln.done .ic { background: var(--clear); box-shadow: none; }
.narr .ln.done .ic::after { content: ""; width: 8px; height: 4px; border-left: 2px solid #0d1f15; border-bottom: 2px solid #0d1f15; transform: rotate(-45deg) translate(1px, -1px); }
.rain { display: flex; gap: 3px; margin-top: 6px; }
.rain i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0; animation: rainIn .3s ease forwards; }
@keyframes rainIn { from { transform: translateY(-8px); opacity: 0; } to { opacity: .9; } }
.bar { height: 4px; border-radius: 2px; background: rgb(255 255 255 / .08); overflow: hidden; margin-top: 8px; width: 220px; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8a7aff, #4cc98a); border-radius: 2px; transition: width 2.4s cubic-bezier(.3, .1, .3, 1); }

/* ============================================================ sheets */
.scrim { position: absolute; inset: 0; z-index: 240; background: rgb(0 0 0 / .45); opacity: 0; transition: opacity .35s; }
.scrim.on { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 250; height: calc(100% - var(--safe-top) - 6px); border-radius: 28px 28px 0 0;
  background: linear-gradient(180deg, #24173a, #1a1029 40%); box-shadow: 0 -0.5px 0 rgb(255 255 255 / .14), 0 -20px 50px rgb(0 0 0 / .5);
  transform: translateY(100%); transition: transform .5s var(--spring); display: flex; flex-direction: column; }
.sheet.dragging { transition: none; }
.grab { flex: none; height: 22px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.grab span { width: 38px; height: 5px; border-radius: 3px; background: rgb(255 255 255 / .28); }
.sbody { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 18px calc(var(--safe-bot) + 24px); scrollbar-width: none; }
.sbody::-webkit-scrollbar { display: none; }
.sh { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 4px 0 10px; touch-action: none; }
.sh h2 { margin: 0; font: 700 22px/1.15 var(--f-text); letter-spacing: -.015em; }
.sh .sub { margin: 4px 0 0; font: 13px var(--f-text); color: var(--text-2); }
.xbtn { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .1); color: var(--text-2); font: 600 15px var(--f-text); display: grid; place-items: center; }
.sec { margin-top: 18px; }
.sec h3 { margin: 0 0 8px; font: 600 12px var(--f-text); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.para { font: 16px/1.45 var(--f-text); color: var(--text); margin: 0; }
.para b { font-weight: 600; }
.foot { font: 12px/1.4 var(--f-text); color: var(--muted); margin: 8px 0 0; }
.box { padding: 12px; border-radius: 16px; background: rgb(255 255 255 / .04); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .07); }
.swarm text { font: 600 10px var(--f-round); fill: var(--muted); }
.swarm .dot { animation: dotRain .45s var(--bounce) both; }
@keyframes dotRain { from { transform: translateY(-26px); opacity: 0; } }
.swarm .ln { fill: none; stroke-width: 1.3; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw2 .5s ease forwards; }
@keyframes draw2 { to { stroke-dashoffset: 0; } }
.tgl { border: 0; height: 28px; padding: 0 10px; border-radius: 999px; background: rgb(255 255 255 / .08); color: var(--text-2); font: 600 12px var(--f-text); letter-spacing: 0; text-transform: none; }
.tgl.on { background: var(--accent-soft); color: var(--accent); }
.receipt { width: 100%; border-collapse: collapse; font: 13.5px var(--f-text); }
.receipt td, .receipt th { padding: 5px 0; text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-round); }
.receipt th { font: 600 11px var(--f-text); letter-spacing: .02em; color: var(--muted); text-align: right; }
.receipt td:first-child, .receipt th:first-child { text-align: left; font-family: var(--f-text); }
.receipt tr.grp td { padding-top: 10px; font: 600 11px var(--f-text); letter-spacing: .07em; color: var(--muted); text-transform: uppercase; }
.receipt tr.tot td { border-top: .5px solid rgb(255 255 255 / .15); font-weight: 700; }
.votebar { display: flex; height: 30px; border-radius: 10px; overflow: hidden; margin-top: 4px; }
.votebar div { display: flex; align-items: center; padding: 0 10px; font: 600 12.5px var(--f-text); white-space: nowrap; animation: grow .6s var(--spring) both; transform-origin: left; }
@keyframes grow { from { transform: scaleX(0); } }

/* ticket */
.pass { border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #2d1f48, #231738); box-shadow: 0 0 0 .5px rgb(255 255 255 / .12), 0 20px 40px -20px rgb(0 0 0 / .9); position: relative; }
.pass .top { padding: 16px 18px 18px; background: linear-gradient(135deg, #8a7aff 0%, #6a54e8 55%, #4a3aa8 100%); color: #120a1e; position: relative; }
.pass .top b { font: 700 24px var(--f-round); display: block; }
.pass .top span { font: 600 13px var(--f-text); opacity: .8; }
.perf { height: 18px; position: relative; background: radial-gradient(circle at 0 50%, #1a1029 9px, transparent 9.5px), radial-gradient(circle at 100% 50%, #1a1029 9px, transparent 9.5px); }
.perf::after { content: ""; position: absolute; left: 16px; right: 16px; top: 50%; border-top: 1.5px dashed rgb(255 255 255 / .18); }
.pass .sec2 { padding: 4px 16px 14px; }
.pass h4 { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 6px; font: 600 11.5px var(--f-text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pass h4 button { border: 0; background: rgb(255 255 255 / .08); color: var(--accent); border-radius: 999px; padding: 4px 10px; font: 600 12px var(--f-text); letter-spacing: 0; text-transform: none; }
.trow { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 9px 0; text-align: left; font: 15px var(--f-text); border-top: .5px solid rgb(255 255 255 / .07); }
.trow .bx { flex: none; width: 24px; height: 24px; border-radius: 7px; box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .3); display: grid; place-items: center; transition: background .2s; }
.trow.on .bx { background: var(--clear); box-shadow: none; }
.trow .bx svg { opacity: 0; } .trow.on .bx svg { opacity: 1; }
.trow.on .bx path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .25s ease-out forwards; }
.trow .tx { flex: 1; min-width: 0; }
.trow .tx small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.trow.on .tx { color: var(--text-2); }
.stamp { position: absolute; right: 18px; top: 20px; transform: rotate(-12deg) scale(1.8); opacity: 0; padding: 4px 12px; border-radius: 8px; border: 3px solid var(--clear); color: var(--clear); font: 800 22px var(--f-round); letter-spacing: .12em; transition: transform .45s var(--bounce), opacity .3s; pointer-events: none; }
.stamp.on { transform: rotate(-12deg) scale(1); opacity: .95; }
.nudge { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font: 13px/1.35 var(--f-text); background: rgb(242 184 75 / .1); color: var(--lean); }
.minis { display: flex; gap: 8px; align-items: center; }
.minis div { text-align: center; font: 600 10px var(--f-round); color: var(--muted); }

/* player sheet */
.phead { display: flex; gap: 14px; align-items: center; }
.phead .mk { width: 60px; height: 60px; flex: none; }
.phead h2 { margin: 0; font: 700 23px var(--f-text); letter-spacing: -.015em; }
.phead p { margin: 3px 0 0; font: 14px var(--f-text); color: var(--text-2); }
.status { margin-top: 12px; padding: 8px 12px; border-radius: 12px; font: 13px var(--f-text); }
.status.red { background: rgb(240 123 123 / .1); color: var(--loss); }
.status.amber { background: rgb(242 184 75 / .1); color: var(--lean); }
.next5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.n5 { position: relative; border-radius: 14px; padding: 8px 4px 8px; text-align: center; background: rgb(255 255 255 / .07); overflow: hidden; }
.n5.sold { background: repeating-linear-gradient(135deg, rgb(255 255 255 / .05) 0 5px, transparent 5px 10px); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .1); }
.n5.before { background: transparent; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .08); opacity: .65; }
.n5.own { background: rgb(138 122 255 / .16); box-shadow: inset 0 0 0 .5px rgb(138 122 255 / .4); }
.n5.edge { background: transparent; outline: 1px dashed rgb(201 192 216 / .3); outline-offset: -1px; }
.n5 .gw { font: 600 10.5px var(--f-round); color: var(--muted); }
.n5 .op { font: 600 12px var(--f-text); color: var(--text-2); margin-top: 2px; letter-spacing: .02em; }
.n5 .x { font: 600 20px var(--f-round); font-variant-numeric: tabular-nums; margin-top: 4px; }
.n5 svg { display: block; margin: 4px auto 0; }
.n5 .fo { font: 9px var(--f-text); color: var(--muted); margin-top: 2px; }
.planline { margin-top: 12px; font: 15px var(--f-text); color: var(--text); }
.planline span { color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.grid2 button { height: 52px; border: 0; border-radius: 14px; background: rgb(255 255 255 / .07); font: 600 15px var(--f-text); color: var(--text); }
.grid2 button.acc { background: var(--accent-soft); color: var(--accent); }
.grid2 button.wide { grid-column: span 2; }
.whynot { margin-top: 12px; padding: 12px; border-radius: 14px; background: rgb(255 255 255 / .05); font: 15px/1.4 var(--f-text); animation: capIn .3s var(--spring); }
.spinner { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgb(138 122 255 / .25); border-top-color: var(--accent); animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }

/* lists (replace / wish) */
.search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: rgb(255 255 255 / .08); margin-top: 6px; }
.search input { flex: 1; border: 0; background: none; color: var(--text); font: 16px var(--f-text); outline: none; }
.search input::placeholder { color: var(--muted); }
.pills { display: flex; gap: 6px; margin-top: 10px; }
.pills button { flex: 1; height: 32px; border: 0; border-radius: 10px; background: rgb(255 255 255 / .06); color: var(--text-2); font: 600 13px var(--f-round); }
.pills button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pills button:disabled { opacity: .3; }
.seg.small { height: 32px; margin-top: 10px; }
.seg.small button { font-size: 12.5px; }
.lrow { display: flex; align-items: center; gap: 10px; width: 100%; height: 62px; border: 0; background: none; padding: 0 2px; text-align: left; border-bottom: .5px solid rgb(255 255 255 / .07); }
.lrow .mk { width: 32px; height: 32px; flex: none; }
.lrow .nm { flex: 1; min-width: 0; }
.lrow .nm b { display: block; font: 600 15px var(--f-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .nm span { font: 12.5px var(--f-text); color: var(--muted); }
.micro { display: flex; gap: 2px; align-items: flex-end; height: 22px; width: 30px; flex: none; }
.micro i { flex: 1; border-radius: 1.5px; background: var(--accent); }
.micro i.f { opacity: .25; }
.lrow .rt { width: 72px; text-align: right; font: 600 14px var(--f-round); font-variant-numeric: tabular-nums; flex: none; }
.lrow .rt small { display: block; font: 600 11px var(--f-text); }
.lrow.blocked { opacity: .55; }
.lrow.picked { background: var(--accent-soft); border-radius: 12px; }
.confirm { position: sticky; bottom: 0; margin: 10px -6px 0; padding: 10px; border-radius: 18px; background: var(--surface-3); box-shadow: 0 -10px 30px rgb(0 0 0 / .4), 0 0 0 .5px rgb(255 255 255 / .12); display: flex; align-items: center; gap: 10px; animation: capIn .3s var(--spring); }
.confirm .t { flex: 1; font: 600 14px var(--f-text); }
.confirm button { height: 40px; border: 0; border-radius: 12px; padding: 0 14px; background: var(--accent); color: var(--accent-ink); font: 600 14px var(--f-text); }
.shelf h3 { margin-top: 18px; }
.reach { border: 0; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 600 13px var(--f-text); flex: none; }
.wishx { padding: 6px 2px 14px; border-bottom: .5px solid rgb(255 255 255 / .07); animation: capIn .3s var(--spring); }
.apills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ap { position: relative; height: 52px; border-radius: 12px; border: 0; background: rgb(255 255 255 / .06); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; overflow: hidden; }
.ap .g { font: 600 10.5px var(--f-round); color: var(--muted); }
.ap .v { font: 600 15px var(--f-round); font-variant-numeric: tabular-nums; }
.ap.sk .v { width: 34px; height: 12px; border-radius: 4px; background: rgb(255 255 255 / .1); }
.ap.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.ap.bad .v { color: var(--muted); font-size: 12px; }
.ap.fill { animation: bump .35s var(--bounce); }
.fund { margin-top: 8px; font: 13px var(--f-text); color: var(--muted); min-height: 18px; }
.btnrow { display: flex; gap: 8px; margin-top: 10px; }
.btnrow button { flex: 1; height: 44px; border: 0; border-radius: 12px; font: 600 15px var(--f-text); background: rgb(255 255 255 / .08); color: var(--text); }
.btnrow button.acc { background: var(--accent); color: var(--accent-ink); }
.btnrow button:disabled { opacity: .4; }

/* fork */
.qs { display: flex; flex-direction: column; gap: 8px; }
.qs button { height: 46px; border: 0; border-radius: 14px; background: rgb(255 255 255 / .07); color: var(--text); font: 600 15px var(--f-text); text-align: left; padding: 0 14px; }
.qs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.lanes { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-top: 14px; }
.lane { position: relative; overflow: hidden; padding: 10px; border-radius: 16px; background: rgb(255 255 255 / .05); }
.lane h5 { margin: 0 0 6px; font: 700 12px var(--f-text); letter-spacing: .06em; color: var(--muted); }
.lane .r { display: flex; justify-content: space-between; font: 600 14px var(--f-round); font-variant-numeric: tabular-nums; padding: 2px 0; }
.lane .r span:first-child { color: var(--muted); font-weight: 500; }
.lane .r.d span:last-child { color: var(--accent); }
.lane .mv { font: 11.5px/1.3 var(--f-text); color: var(--text-2); margin-top: 6px; min-height: 30px; }
.mid { text-align: center; font: 600 13px var(--f-text); padding: 8px 8px; border-radius: 12px; background: rgb(255 255 255 / .06); white-space: nowrap; }

/* you */
.you-team { display: flex; gap: 14px; align-items: center; }
.you-team .avatar { width: 56px; height: 56px; font-size: 19px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.stats div { padding: 12px; border-radius: 14px; background: rgb(255 255 255 / .05); }
.stats b { display: block; font: 600 22px var(--f-round); font-variant-numeric: tabular-nums; }
.stats span { font: 12px var(--f-text); color: var(--muted); }
.jrow { padding: 10px 0; border-top: .5px solid rgb(255 255 255 / .07); font: 14px var(--f-text); }
.jrow small { display: block; color: var(--muted); font-size: 12.5px; }
.kv { display: flex; justify-content: space-between; padding: 8px 0; border-top: .5px solid rgb(255 255 255 / .07); font: 14px var(--f-text); }
.kv span:last-child { color: var(--text-2); text-align: right; }

/* toasts */
.toasts { position: absolute; left: 12px; right: 12px; z-index: 380; top: calc(var(--safe-top) + 4px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: 100%; padding: 10px 14px; border-radius: 16px; background: rgb(44 32 66 / .94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 0 0 .5px rgb(255 255 255 / .14), 0 14px 30px -10px rgb(0 0 0 / .8); font: 14px/1.35 var(--f-text); animation: toastIn .45s var(--spring); }
.toast.out { animation: toastOut .3s ease forwards; }
@keyframes toastIn { from { transform: translateY(-24px) scale(.96); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-14px); opacity: 0; } }
.toast button { flex: none; border: 0; background: none; color: var(--accent); font: 600 14px var(--f-text); padding: 2px 0 2px 4px; }

/* ============================================================ reduce motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; }
  .flipper { transition: opacity .15s !important; }
}

/* ============================================================ narrow: full bleed, no frame */
@media (max-width: 760px) { .panel { display: none; } .stage { gap: 0; } }
@media (max-width: 520px) {
  body { overflow: hidden; }
  .stage { padding: 0; }
  .device { width: 100vw; height: 100vh; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; transform: none !important; }
  .device::before, .device::after { display: none; }
  .app { width: 100%; height: 100%; border-radius: 0; }
  .island, .statusbar, .homeind { display: none; }
  :root { --safe-top: max(env(safe-area-inset-top), 14px); --safe-bot: max(env(safe-area-inset-bottom), 8px); }
}

/* ---------------------------------------------------------------- edits powered by the phone engine */
/** W3 veto: the best plan without that buy (best replacement for the same sale, or keep the player). */
function planB(m) {
  const opts = [{ moves: dropMove(S.moves, m), what: `keep ${nm(m.out)}` }];
  for (const c of P.values()) {
    if (c.pos !== posOf(m.out) || !c.buy || c.id === m.in || c.id === m.out) continue;
    const ms = swapIn(S.moves, m, c.id); const r = mk(ms); if (r.errors.length) continue;
    opts.push({ moves: ms, what: `${nm(c.id)} instead`, road: r });
  }
  opts.forEach((o) => { o.road = o.road || mk(o.moves); });
  return opts.sort((a, b) => b.road.total - a.road.total)[0];
}
function veto(k) {
  const m = S.moves.find((x) => x.k === k); if (!m) return;
  const b = planB(m); const before = cur();
  const c = compare(b.road, before);
  commit({ moves: b.moves, compare: false }, { from: m.gw, msg: () => `Plan without ${esc(nm(m.in))}: <b>${sgn(c.delta)}</b> over 4 GWs · <span class="g-${c.label}">${GLYPH[c.label]} ${WORD[c.label]}</span> (${esc(b.what)})` });
}
/** Replace sheet ranking: sell `out` from week g, every candidate scored instantly over the window. */
function replaceOptions(out, g) {
  const base = cur(); const before = g === A ? INIT : base.weeks[g - A - 1].squad;
  return [...P.values()].filter((c) => c.pos === posOf(out) && c.id !== out && (c.buy || before.includes(c.id))).map((c) => {
    if (before.includes(c.id)) return { id: c.id, blocked: 'In team' };
    const { ms, road: r } = addMove(S.moves, { gw: g, out, in: c.id });
    const e = r.errors.find((x) => x.code === 'budget') || r.errors.find((x) => x.code === 'club') || r.errors[0];
    if (e) return { id: c.id, blocked: e.code === 'budget' ? `−${money(e.short)}` : e.code === 'club' ? `4th ${e.club}` : 'n/a', ms, road: r };
    return { id: c.id, ms, road: r, delta: r.total - base.total, cmp: null };
  });
}
/** Wish: for each week, the cheapest way to own `id` from then (best funding sale of the same position). */
function wishOptions(id) {
  const base = cur(); const pos = posOf(id);
  return GWS.map((g) => {
    const before = g === A ? INIT : base.weeks[g - A - 1].squad;
    if (before.includes(id)) return { g, owned: true };
    let best = null; let short = null;
    for (const out of before.filter((x) => posOf(x) === pos)) {
      const { ms, road: r } = addMove(S.moves, { gw: g, out, in: id });
      const err = r.errors[0];
      if (err) { if (err.code === 'budget') short = Math.min(short ?? 99, err.short); continue; }
      if (!best || r.total > best.road.total) best = { g, out, ms, road: r };
    }
    if (!best) return { g, blocked: short != null ? `−${money(short)}` : 'club limit' };
    best.delta = best.road.total - base.total; best.hit = best.road.weeks[g - A].hits > base.weeks[g - A].hits;
    best.cmp = compare(best.road, base);
    return best;
  });
}

/* Player (medium → large) */
function planLine(id, road) {
  const owned0 = INIT.includes(id); const outM = road.moves.find((m) => m.out === id); const inM = road.moves.find((m) => m.in === id);
  if (inM && outM) return `Bought GW${inM.gw} for ${esc(nm(inM.out))}, sold GW${outM.gw} → ${esc(nm(outM.in))} <span>(a ${weeksWord(outM.gw - inM.gw)} rental)</span>`;
  if (inM) return `Arrives GW${inM.gw} for ${esc(nm(inM.out))}`;
  if (outM) return `Sold GW${outM.gw} → ${esc(nm(outM.in))}${owned0 ? '' : ''}`;
  if (owned0) return `In your plan: kept to GW${LAST}`;
  return '<span>Not in your plan</span>';
}
function openPlayer(id, ctxGw = A) {
  const p = P.get(id);
  openSheet({
    detent: 'medium', build(body, sh) {
      sh.allowMedium = true;
      const draw = () => {
        const road = cur(); const ownedNow = road.weeks[ctxGw - A].squad.includes(id);
        const everOwned = INIT.includes(id) || road.moves.some((m) => m.in === id);
        const tone = statusTone(id);
        const status = p.status !== 'a' || (p.chance != null && p.chance < 100) ? `<div class="status ${tone || 'amber'}">${p.chance != null ? `${p.chance}% · ` : ''}${esc(p.news || p.status)}</div>`
          : p.pre === 'B' ? '<div class="status amber">Predicted: bench (lineup preview, GW6 only)</div>' : p.pre === 'O' ? '<div class="status red">Predicted: out (lineup preview, GW6 only)</div>' : '';
        // whiskers share one scale per sheet: the min–max across runs, padded
        const lo0 = Math.min(...p.lo) - 0.3, hi0 = Math.max(...p.hi) + 0.3; const Y = (v) => 26 - ((v - lo0) / (hi0 - lo0 || 1)) * 24;
        const cols = [...GWS, EDGE].map((g, i) => {
          const owned = g <= LAST && road.weeks[i].squad.includes(id); const wasOwned = g <= LAST && !owned && (INIT.includes(id) || road.weeks.slice(0, i).some((w) => w.squad.includes(id)));
          // the plan, as column backgrounds: solid while owned, hatched once sold, ghosted before he arrives
          const cls = g === EDGE ? 'edge' : owned ? 'own' : wasOwned ? 'sold' : everOwned ? 'before' : '';
          const lo = p.lo[i], hi = p.hi[i]; const yl = Y(lo), yh = Y(hi);
          return `<div class="n5 ${cls}"><div class="gw">GW${g}</div><div class="op">${esc(p.opp[i] || '—')}</div><div class="x">${f1(p.xp[i])}</div>
            <svg width="40" height="28" viewBox="0 0 40 28"><line x1="20" x2="20" y1="${yh}" y2="${yl}" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><line x1="15" x2="25" y1="${yh}" y2="${yh}" stroke="var(--accent)" stroke-width="1.5"/><line x1="15" x2="25" y1="${yl}" y2="${yl}" stroke="var(--accent)" stroke-width="1.5"/><circle cx="20" cy="${Y(p.xp[i])}" r="2.6" fill="#fff"/></svg>
            ${g === EDGE ? '<div class="fo">forecast only</div>' : `<div class="fo num">${f1(lo)}–${f1(hi)}</div>`}</div>`;
        }).join('');
        const actions = ownedNow

          : `<button class="acc" data-pa="wish">Wish for him</button><button data-pa="whynot">Why not?</button><button class="wide" data-pa="never">Never buy</button>`;
        body.innerHTML = `${head('', '')}<div class="phead" style="margin-top:-38px"><span class="mk">${kitOf(id)}</span><div><h2>${esc(p.name)}</h2><p>${p.club} · ${p.pos} · ${INIT.includes(id) ? `sells ${money(p.sell ?? p.price)}` : money(p.price)}</p></div></div>
          ${status}
          <div class="sec"><h3><span>Next 5 · forecast points</span><span style="letter-spacing:0;text-transform:none;font-weight:500">min–max across ${R} runs</span></h3><div class="next5">${cols}</div></div>

        wireClose(body, sh);
        $$('[data-pa]', body).forEach((b) => (b.onclick = () => playerAction(b.dataset.pa, id, ctxGw, body, sh)));

async function playerAction(a, id, g, body, sh) {
  if (a === 'cap') {
    // captain is a phone-only lineup: instant, no solve (design M4)
    const caps = { ...S.caps, [g]: id }; closeAll();
    const before = cur(); const c = compare(mk(S.moves, { caps }), before);
    const snap = snapshot(); S.caps = caps; render();
    toast(`${esc(nm(id))} (C) in GW${g}: <b>${sgn(c.delta)}</b> · <span class="g-${c.label}">${GLYPH[c.label]} ${WORD[c.label]}</span>${c.label !== 'clear' ? ` · ${c.delta >= 0 ? c.votes : c.against} of ${R} runs` : ''}.`, { undo: () => restore(snap) });
    return;
  }
  if (a === 'keep') {
    let ms = S.moves; for (const m of S.moves.filter((x) => x.out === id)) ms = dropMove(ms, ms.find((x) => x.k === m.k));
    closeAll();
    if (ms.length === S.moves.length) return toast(`${esc(nm(id))} is already kept through GW${LAST}.`);
    commit({ moves: ms }, { msg: (c) => `Keeping ${esc(nm(id))}: ${healCopy(c)}` });
    return;
  }
  if (a === 'sell') { closeAll(); openReplace(id, g); return; }
  if (a === 'wish') { closeAll(); openWish(id); return; }
  if (a === 'never') {
    closeAll();
    const ms = S.moves.filter((m) => m.in === id);
    if (!ms.length) return toast(`Noted: the Mac won't suggest ${esc(nm(id))} (exclude pin).`, { sim: true });
    veto(ms[0].k); return;
  }
  if (a === 'whynot') {
    const box = $('#whynot', body); box.innerHTML = `<div class="whynot"><span class="spinner"></span>Asking the Mac…${SIM()}</div>`;
    if (sh.detent !== 'large') { sh.detent = 'large'; sh.place(); }
    await wait(1400);
    const opt = wishOptions(id).find((o) => o.g === A);
    if (!opt || opt.blocked) { box.innerHTML = `<div class="whynot">${esc(nm(id))} from GW${A} needs ${opt?.blocked ? `${opt.blocked.replace('−', '')} more` : 'a different squad'}. <b>Show a 2-move path?</b>${SIM()}</div>`; return; }
    const c = opt.cmp; const pushed = cur().weeks[0].xi.filter((x) => !opt.road.weeks[0].xi.includes(x) && x !== opt.out);
    box.innerHTML = `<div class="whynot">${esc(nm(id))} from GW${A}: <b>${sgn(c.delta)}</b> over 4 GWs${opt.hit ? ' including a −4' : ''}, selling ${esc(nm(opt.out))}${pushed.length ? `; he'd push ${esc(nm(pushed[0]))} out of the XI` : ''}. <span class="g-${c.label}">${GLYPH[c.label]} ${WORD[c.label]}</span> · ${c.votes} of ${R} runs prefer it.
      <div class="btnrow"><button class="acc" id="doit">Do it anyway</button></div></div>`;
    $('#doit', box).onclick = () => { closeAll(); commit({ moves: opt.ms }, { from: A }); };
  }
}

/* Replace (large): from a long-press drop on a week tick, or Player → Sell from… */

        const sp = P.get(out).sell ?? P.get(out).price;

        const sorters = { plan: (a, b) => (b.delta ?? -99) - (a.delta ?? -99), week: (a, b) => xp(b.id, st.g) - xp(a.id, st.g), cheap: (a, b) => P.get(a.id).price - P.get(b.id).price };

          <div class="seg small"><span class="thumb" style="width:calc((100% - 4px)/3);transform:translateX(${['plan', 'week', 'cheap'].indexOf(st.sort) * 100}%)"></span>${[['plan', 'Best for plan'], ['week', `GW${st.g} only`], ['cheap', 'Cheapest']].map(([k, l]) => `<button data-sort="${k}" aria-selected="${st.sort === k}">${l}</button>`).join('')}</div>
          <div id="rlist">${opts.map((o) => {

              <span class="rt">${o.blocked ? `<small class="${o.blocked.startsWith('−') ? 'g-loss' : ''}" style="color:${o.blocked.startsWith('−') ? '' : 'var(--muted)'}">${esc(o.blocked)}</small>` : `≈ ${sgn(o.delta)} <span class="g-${cmp.label}">${GLYPH[cmp.label]}</span>`}</span></button>`;
          }).join('')}</div>
          <p class="foot">"Best for plan" scores each swap on the phone over GW${A}–${LAST} with the best XI per week; the Mac confirms after you add it. Search covers the ${P.size} players packed into this concept.</p>
          ${st.pick ? (() => { const o = replaceOptions(out, st.g).find((x) => x.id === st.pick); const cmp = compare(o.road, road); return `<div class="confirm"><span class="t">${esc(nm(st.pick))} from GW${st.g} · ≈ ${sgn(o.delta)} · <span class="g-${cmp.label}">${GLYPH[cmp.label]}</span></span><button id="addplan">Add to plan</button></div>`; })() : ''}`;
        wireClose(body, sh);
        $$('[data-g]', body).forEach((b) => (b.onclick = () => { st.g = +b.dataset.g; st.pick = null; draw(); }));
        $$('[data-sort]', body).forEach((b) => (b.onclick = () => { st.sort = b.dataset.sort; draw(); }));
        const q = $('#rq', body); q.oninput = () => { st.q = q.value; const pos = q.selectionStart; draw(); const n = $('#rq', body); n.focus(); n.setSelectionRange(pos, pos); };

        const add = $('#addplan', body);

function blockedCopy(b, g) {

  if (t.startsWith('4th')) return `That's a 4th ${t.slice(4)} player in GW${g}.`;
  return 'Already in your team.';
}

/* Wish (large): arrival pills per week, filled two at a time (SIMULATED solve latency over phone numbers) */
function openWish(preId = null) {
  const st = { q: '', open: preId, results: {}, sel: {} };
  openSheet({
    detent: 'large', build(body, sh) {
      const road0 = cur();
      const ownedAny = new Set(road0.weeks.flatMap((w) => w.squad).concat(INIT));
      const likes = [...P.values()].filter((p) => p.buy && !ownedAny.has(p.id)).sort((a, b) => sum(b.xp.slice(0, 4)) - sum(a.xp.slice(0, 4))).slice(0, 5);
      const later = road0.moves.filter((m) => m.gw > A).map((m) => m.in);
      const row = (id) => {
        const p = P.get(id); const open = st.open === id; const res = st.results[id];
        let x = '';
        if (open) {
          const sel = st.sel[id];
          x = `<div class="wishx"><div class="apills">${GWS.map((g) => {
            const o = res?.[g];
            if (!o) return `<button class="ap sk shimmer"><span class="g">GW${g}</span><span class="v"></span></button>`;
            if (o.owned) return `<button class="ap bad fill" disabled><span class="g">GW${g}</span><span class="v">owned</span></button>`;
            if (o.blocked) return `<button class="ap bad fill" disabled><span class="g">GW${g}</span><span class="v ${o.blocked.startsWith('−') ? 'g-loss' : ''}">${esc(o.blocked)}</span></button>`;
            return `<button class="ap fill ${sel === g ? 'sel' : ''}" data-ap="${g}"><span class="g">GW${g}${o.hit ? ' · −4' : ''}</span><span class="v ${o.delta < 0 ? '' : 'g-clear'}">${sgn(o.delta)}</span></button>`;
          }).join('')}</div>
          <div class="fund">${sel && res?.[sel] ? `Sells ${esc(nm(res[sel].out))} in GW${sel}${res[sel].hit ? ' (−4 hit)' : ''} · <span class="g-${res[sel].cmp.label}">${GLYPH[res[sel].cmp.label]} ${WORD[res[sel].cmp.label]}</span>${res[sel].cmp.label !== 'clear' ? ` · ${res[sel].delta >= 0 ? `${res[sel].cmp.votes} of ${R} runs back him` : `${res[sel].cmp.against} of ${R} runs back your plan`}` : ''}` : Object.keys(res || {}).length < GWS.length ? `Asking the Mac, two weeks at a time…${SIM()}` : 'No week works without a bigger rebuild.'}</div>
          <div class="btnrow"><button class="acc" id="makeplan" ${sel ? '' : 'disabled'}>Make it the plan</button><button id="notnow">Not now</button></div></div>`;
        }
        return `<div><div class="lrow" style="cursor:default"><span class="mk">${kitOf(id)}</span><span class="nm" data-player="${id}" style="cursor:pointer"><b>${esc(p.name)}</b><span>${p.club} · ${money(p.price)} · xP GW${A}–${LAST} ${f1(sum(p.xp.slice(0, 4)))}</span></span>${open ? '' : `<button class="reach" data-reach="${id}">Reach</button>`}</div>${x}</div>`;
      };
      const draw = () => {
        const q = fold(st.q);
        const hits = q ? [...P.values()].filter((p) => fold(p.name).includes(q) && !road0.weeks[0].squad.includes(p.id)).slice(0, 12).map((p) => p.id) : null;
        body.innerHTML = `${head('Wish', 'Say who you want; I\'ll find the cheapest week and what it costs.')}
          <div class="search"><span style="color:var(--muted)">⌕</span><input id="wq" placeholder="Who do you want?" value="${esc(st.q)}"></div>
          ${st.open && !hits?.includes(st.open) && !likes.some((p) => p.id === st.open) ? `<div class="sec">${row(st.open)}</div>` : ''}
          ${hits ? `<div class="sec">${hits.length ? hits.map(row).join('') : `<p class="foot">No one by that name in the ${P.size} players packed into this concept.</p>`}</div>`
            : `<div class="shelf"><h3 class="sec">The model likes, you don't own <span style="font-weight:400;letter-spacing:0;text-transform:none">tap a name for Why not?</span></h3>${likes.map((p) => row(p.id)).join('')}
               ${later.length ? `<h3 class="sec">Your plan buys later</h3>${later.map((id) => `<div class="lrow" style="cursor:default"><span class="mk">${kitOf(id)}</span><span class="nm"><b>${esc(nm(id))}</b><span>arrives GW${road0.moves.find((m) => m.in === id).gw} · bring him forward from his sheet</span></span><button class="reach" data-player="${id}">Open</button></div>`).join('')}` : ''}</div>`}
`;

        $$('[data-reach]', body).forEach((b) => (b.onclick = () => reach(+b.dataset.reach)));
        $$('[data-player]', body).forEach((b) => (b.onclick = () => openPlayer(+b.dataset.player, A)));
        $$('[data-ap]', body).forEach((b) => (b.onclick = () => { st.sel[st.open] = +b.dataset.ap; draw(); }));
        const mp = $('#makeplan', body);
        if (mp) mp.onclick = () => {
          const o = st.results[st.open][st.sel[st.open]]; const id = st.open; closeSheet(sh);
          S.tab = 'ahead'; S.aheadSeen = true; stopAutoplay(); S.aheadGw = o.g;
          commit({ moves: o.ms }, { from: o.g, msg: (c) => `${esc(nm(id))} from GW${o.g}: ${healCopy(c).replace('Your version: ', '')}` });
          reroute(o.g);

        const nn = $('#notnow', body); if (nn) nn.onclick = () => { st.open = null; draw(); };
      };

        st.open = id; st.results[id] = {}; st.sel[id] = null; draw();
        const all = wishOptions(id);

        }
        const ok = all.filter((o) => o.delta != null); if (ok.length) { st.sel[id] = ok.sort((a, b) => b.delta - a.delta)[0].g; draw(); }
      };
      draw();
      if (preId) reach(preId);
    },
  });
}
async function reroute(from) {

}

      const free = w.ftAvail > w.ftUsed; const qs = [];
      if (w.moves.length) qs.push(['roll', 'Roll this week?']);
      qs.push(['hit', free ? 'Use the free transfer here?' : 'Allow a −4 here?']);
      const laneB = () => (st.q === 'roll' ? 'ROLL' : free ? 'ONE MORE MOVE' : '−4');
      const draw = () => {
        const B = st.B;
        body.innerHTML = `${head(`GW${g} fork`, 'Pick a question; lane B is the plan if you say yes.')}
          <div class="qs">${qs.map(([k, l]) => `<button data-q="${k}" aria-pressed="${st.q === k}">${l}</button>`).join('')}</div>
          ${B ? `<div class="lanes"><div class="lane"><h5>A · YOUR PLAN</h5>${GWS.map((x, i) => `<div class="r"><span>GW${x}</span><span>${f1(road.weeks[i].pts)}</span></div>`).join('')}<div class="mv">${esc(movesLine(w))}</div></div>
            <div class="mid ${st.solving ? 'shimmer' : ''}" style="position:relative;overflow:hidden">B ${sgn(B.cmp.delta)}<br><span class="g-${B.cmp.label}">${GLYPH[B.cmp.label]} ${WORD[B.cmp.label]}</span></div>
            <div class="lane ${st.solving ? 'shimmer' : ''}"><h5>B · ${laneB()}</h5>${GWS.map((x, i) => `<div class="r ${Math.abs(B.road.weeks[i].pts - road.weeks[i].pts) > 0.05 ? 'd' : ''}"><span>GW${x}</span><span>${st.solving ? '≈' : ''}${f1(B.road.weeks[i].pts)}</span></div>`).join('')}<div class="mv">${esc(movesLine(B.road.weeks[g - A]))}</div></div></div>
            ${st.solving ? `<p class="foot">The Mac is confirming lane B…${SIM()}</p>` : ''}
            <div class="btnrow"><button id="keepA">Keep A</button><button class="acc" id="keepB" ${st.solving ? 'disabled' : ''}>Keep B</button></div>` : ''}`;
        wireClose(body, sh);
        $$('[data-q]', body).forEach((b) => (b.onclick = () => ask(b.dataset.q)));
        const ka = $('#keepA', body); if (ka) ka.onclick = () => closeSheet(sh);
        const kb = $('#keepB', body); if (kb) kb.onclick = () => { closeSheet(sh); commit({ moves: B.moves }, { from: g }); };
      };
      const ask = async (q) => {
        st.q = q;
        let ms;
        if (q === 'roll') { ms = S.moves; for (const m of S.moves.filter((x) => x.gw === g)) ms = dropMove(ms, ms.find((x) => x.k === m.k)); }
        else {
          const before = g === A ? INIT : road.weeks[g - A - 1].squad; let best = null;
          const movedOut = new Set(w.moves.map((m) => m.out));
          for (const out of before.filter((x) => !movedOut.has(x))) for (const c of P.values()) {
            if (c.pos !== posOf(out) || !c.buy || before.includes(c.id) || w.squad.includes(c.id)) continue;
            const { ms: t, road: r } = addMove(S.moves, { gw: g, out, in: c.id }); if (r.errors.length || (!free && r.weeks[g - A].hits <= w.hits)) continue;
            if (!best || r.total > best.r.total) best = { t, r };
          }
          ms = best ? best.t : S.moves;
        }
        const r = mk(ms); st.B = { moves: ms, road: r, cmp: compare(r, road) }; st.solving = true;
        if (sh.detent !== 'large') { sh.detent = 'large'; sh.place(); }
        draw();
        await wait(reduceMotion ? 300 : 2200); st.solving = false; if (S.sheets.includes(sh)) draw();
      };
      draw();
    },
  });
}

/* Chips: on-phone estimate, then "Test it" (SIMULATED manual-chip solve) */
function openChip(c) {
  const g = S.aheadGw; const road = cur(); const w = road.weeks[g - A];
  const planned = Object.entries(S.chips).find(([, v]) => v === c)?.[0];
  const est = c === 'bb' ? sum(w.bench.map((id) => xp(id, g))) : c === 'tc' ? xp(w.captain, g) : null;
  const name = { bb: 'Bench Boost', tc: 'Triple Captain', fh: 'Free Hit', wc: 'Wildcard' }[c];
  openSheet({
    detent: 'small', build(body, sh) {
      const draw = (state = 'idle') => {
        body.innerHTML = `${head(`${name} in GW${g}`, est != null ? `≈ +${f1(est)} ${c === 'bb' ? '(your planned bench)' : `(${esc(nm(w.captain))}'s ${f1(xp(w.captain, g))})`}` : 'No phone estimate for this chip.')}
          ${state === 'testing' ? `<p class="para"><span class="spinner"></span>Testing on the Mac…${SIM()}</p>` : state === 'done' ? `<p class="para">${est != null ? `Test result: <b>≈ +${f1(est)}</b> in GW${g}.` : 'This concept can\'t run a Free Hit solve.'}${SIM()}</p><p class="foot">${est != null ? 'Simulated: the app would run a manual-chip solve here; this shows the phone estimate.' : 'In the app the Mac answers in about 6 s with the Free Hit squad and its price.'}</p>` : `<p class="para">${planned ? `Planned for GW${planned}.` : est != null ? `${name} in GW${g} ≈ +${f1(est)}. Test it?` : 'Test it?'}</p>`}
          <div class="btnrow">${planned && +planned === g ? '<button id="unplan">Take it off</button>' : state === 'done' && est != null ? `<button class="acc" id="plan">Plan it for GW${g}</button>` : `<button class="acc" id="test" ${state === 'testing' ? 'disabled' : ''}>Test</button>`}<button data-close>Close</button></div>`;
        wireClose(body, sh);
        const t = $('#test', body); if (t) t.onclick = async () => { draw('testing'); await wait(reduceMotion ? 300 : 2400); if (S.sheets.includes(sh)) draw('done'); };
        const p = $('#plan', body); if (p) p.onclick = () => { closeSheet(sh); const chips = Object.fromEntries(Object.entries(S.chips).filter(([k, v]) => v !== c && +k !== g)); chips[g] = c; commit({ chips }, { from: g, msg: () => `${name} planned for GW${g}: ≈ +${f1(est)} that week. One use, so it only pays if no later week beats it.` }); };
        const u = $('#unplan', body); if (u) u.onclick = () => { closeSheet(sh); const chips = { ...S.chips }; delete chips[g]; commit({ chips }, { from: g }); };
      };
      draw();
    },
  });
}

/* Move row menu: veto / retime */
function openMoveMenu(k) {
  const m = S.moves.find((x) => x.k === k); if (!m) return;
  openSheet({
    detent: 'small', build(body, sh) {
      const opts = GWS.filter((g) => g !== m.gw).map((g) => { const t = retime(S.moves, m, g); const r = mk(t); return { g, t, r, ok: !r.errors.length, d: r.total - cur().total }; });
      body.innerHTML = `${head(`${esc(nm(m.out))} → ${esc(nm(m.in))}`, `GW${m.gw}`)}
        <div class="sec"><h3>Move to GW…</h3><div class="apills">${GWS.map((g) => { const o = opts.find((x) => x.g === g); if (!o) return `<button class="ap sel" disabled><span class="g">GW${g}</span><span class="v">now</span></button>`; return `<button class="ap ${o.ok ? '' : 'bad'}" data-to="${g}" ${o.ok ? '' : 'disabled'}><span class="g">GW${g}</span><span class="v">${o.ok ? `≈ ${sgn(o.d)}` : 'n/a'}</span></button>`; }).join('')}</div></div>
        <div class="btnrow"><button class="acc" id="nothim" style="background:var(--loss);color:#2a0b10">Not him (veto)</button><button data-close>Close</button></div>`;
      wireClose(body, sh);
      $('#nothim', body).onclick = () => { closeSheet(sh); veto(k); };
      $$('[data-to]', body).forEach((b) => (b.onclick = () => { const o = opts.find((x) => x.g === +b.dataset.to); closeSheet(sh); S.aheadGw = o.g; commit({ moves: o.t }, { from: Math.min(o.g, m.gw) }); }));
    },
  });
}
