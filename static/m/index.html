<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1: iOS Safari never auto-zooms on a focused field (the team search zoomed the page ~1.15x and it
     stayed zoomed on the team: the user, 2026-10-07); iOS ignores it for pinch-to-zoom, which still works -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forkcast">
<meta name="application-name" content="Forkcast">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F7F7F5">
<meta name="description" content="Plans transfers, captain and chips for your FPL team over the next four gameweeks.">
<title>Forkcast</title>
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="apple-touch-icon" href="/m/icon-180.png">
<link rel="icon" type="image/svg+xml" href="/m/icon.svg">
<link rel="icon" type="image/png" sizes="180x180" href="/m/icon-180.png">
<script>
  // Light only (user order 2026-10-08): never the system's dark scheme, whatever an older version stored in fc:s:theme
  document.documentElement.dataset.theme = 'light';
</script>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/views/plan-pitch.css">
<link rel="stylesheet" href="/css/m.css">
<link rel="stylesheet" href="/css/m-you.css">
<link rel="stylesheet" href="/css/m-why.css">
<link rel="stylesheet" href="/css/m-ahead.css">
<link rel="stylesheet" href="/css/m-a.css">
</head>
<body>
<div class="m-app" id="app">
  <section class="m-screen" id="m-ahead" aria-label="Ahead"></section>

  <div class="m-gate" id="m-gate">
    <div class="m-wordmark"><h1>Forkcast</h1></div>
  </div>
</div>
<noscript><p style="padding:24px;font:17px system-ui">Forkcast needs JavaScript.</p></noscript>
<script type="module" src="/js/m/app.js"></script>
</body>
</html>
